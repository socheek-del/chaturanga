name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm 10 crashes resolving this dependency tree; use npm 11.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run build:sittuyin
      - run: npm run build:xiangqi
      - run: npm run build:shogi
      - run: npm run build:janggi
      - run: npm run build:chess
      - run: npm run build:threechess
      - run: npm run build:beanroti-apps
      - run: npm run build -w apps/shatranj/web -w apps/shatranj/worker
      - run: npm run build -w apps/chaturanga/web -w apps/chaturanga/worker
      - run: npm run build:fortress
      - run: npm run build:dameo
