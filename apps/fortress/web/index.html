<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="description"

    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:image" content="%SITE_URL%/og-image.svg" />

      {
