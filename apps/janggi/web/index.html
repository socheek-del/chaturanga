<!doctype html>
<html lang="%DEFAULT_LOCALE%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4e8c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>무료 온라인 장기 — 컴퓨터, 친구와 두기 | Janggi</title>
    <meta
      name="description"
      content="가입 없이 무료로 장기를 두세요. 여섯 단계 컴퓨터, 방 코드로 친구와 대국, 한 기기로 둘이 두기, 강의 열네 개 · Play Janggi (Korean chess) online free."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="ko" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%SITE_URL%/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="장기 · Janggi" />
    <meta property="og:title" content="무료 온라인 장기 — 컴퓨터, 친구와 두기 | Janggi" />
    <meta
      property="og:description"
      content="가입 없이 무료로 장기를 두세요. 컴퓨터와, 친구와, 그리고 강의로 · Play Janggi (Korean chess) online free."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="장기 · Janggi — a Janggi board with the pieces on their opening points" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="무료 온라인 장기 | Janggi" />
    <meta name="twitter:description" content="Play Janggi (Korean chess) online free: computer, friends, two on one device and lessons." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "장기 · Janggi",
            "alternateName": ["Janggi", "Korean Chess", "장기", "한국 장기", "Changgi"],
            "inLanguage": ["ko", "en"]
          },
          {
            "@type": ["VideoGame", "WebApplication"],
            "@id": "%SITE_URL%/#game",
            "name": "장기 · Janggi (Korean Chess)",
            "alternateName": ["Janggi", "Korean Chess", "장기"],
            "url": "%SITE_URL%/",
            "description": "Play Janggi (Korean chess) online for free: against the computer at 6 levels, with friends by room code, two players on one device, plus 14 interactive lessons for beginners. Korean and English.",
            "image": "%SITE_URL%/og-image.png",
            "genre": ["Board game", "Chess", "Strategy"],
            "gamePlatform": ["Web browser", "Android", "iOS"],
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "playMode": ["SinglePlayer", "MultiPlayer"],
            "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 2 },
            "inLanguage": ["ko", "en"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
            "license": "https://www.gnu.org/licenses/gpl-3.0.html",
            "codeRepository": "https://github.com/socheek-del/chaturanga"
          }
        ]
      }
    </script>
    <script>
      // Apply the saved colour scheme and language before first paint (avoids a light flash in dark mode).
      try {
        // %SETTINGS_KEY% and %LOCALES_JSON% come from product.config.ts (see vite.config.ts).
        var saved = (JSON.parse(localStorage.getItem('%SETTINGS_KEY%') || '{}').state) || {};
        var scheme = saved.colorScheme || 'system';
        var dark = scheme === 'dark' || (scheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var locales = %LOCALES_JSON%;
        var urlLang = new URLSearchParams(location.search).get('lang');
        var lang = locales.indexOf(urlLang) >= 0 ? urlLang : locales.indexOf(saved.language) >= 0 ? saved.language : null;
        if (lang) document.documentElement.lang = lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
