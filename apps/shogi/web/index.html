    <meta
      name="description"
      content="将棋を無料でオンライン対局。登録不要。六段階のコンピュータ、合言葉で友達と、ひとつの端末でふたりでも。十五のレッスンつき · Play Shogi (Japanese chess) online free."
    />

    <link rel="alternate" hreflang="en" href="%SITE_URL%/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="将棋 · Shogi" />
    <meta property="og:title" content="将棋を無料でオンライン対局 — コンピュータと友達と | Shogi" />
    <meta
      property="og:description"
      content="将棋を無料でオンライン対局。登録不要。コンピュータと、友達と、レッスンで一から · Play Shogi (Japanese chess) online free."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="将棋 · Shogi — a Shogi board with wooden pieces" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="将棋を無料でオンライン対局 | Shogi" />
    <meta name="twitter:description" content="Play Shogi (Japanese chess) online free: computer, friends, pass-and-play and lessons." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "将棋 · Shogi",
            "alternateName": ["Shogi", "Japanese Chess", "将棋", "しょうぎ", "Shougi"],
            "inLanguage": ["ja", "en"]
          },
          {
            "@type": ["VideoGame", "WebApplication"],
            "@id": "%SITE_URL%/#game",
            "name": "将棋 · Shogi (Japanese Chess)",
            "alternateName": ["Shogi", "Japanese Chess", "将棋", "Shougi"],
            "url": "%SITE_URL%/",
            "description": "Play Shogi (Japanese chess) online for free: against the computer at 6 levels, with friends by room code, pass-and-play on one device, plus 15 interactive lessons for beginners. Japanese and English.",
            "image": "%SITE_URL%/og-image.png",
            "genre": ["Board game", "Chess", "Strategy"],
            "gamePlatform": ["Web browser", "Android", "iOS"],
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "playMode": ["SinglePlayer", "MultiPlayer"],
            "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 2 },
            "inLanguage": ["ja", "en"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
            "license": "https://www.gnu.org/licenses/gpl-3.0.html",
            "codeRepository": "https://github.com/socheek-del/chaturanga"
          }
        ]
      }
    </script>
    <script>
      // Apply the saved colour scheme and language before first paint (avoids a light flash in dark mode).
      try {
        // %SETTINGS_KEY% and %LOCALES_JSON% come from product.config.ts (see vite.config.ts).
        var saved = (JSON.parse(localStorage.getItem('%SETTINGS_KEY%') || '{}').state) || {};
        var scheme = saved.colorScheme || 'system';
        var dark = scheme === 'dark' || (scheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var locales = %LOCALES_JSON%;
        var urlLang = new URLSearchParams(location.search).get('lang');
        var lang = locales.indexOf(urlLang) >= 0 ? urlLang : locales.indexOf(saved.language) >= 0 ? saved.language : null;
        if (lang) document.documentElement.lang = lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
